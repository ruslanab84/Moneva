<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <style>
    html, body { margin: 0; padding: 0; }
    .screen {
      width: 390px; height: 780px;
      background: #F6F4F0;
      font-family: -apple-system, "SF Pro Text", system-ui, sans-serif;
      padding: 20px 16px 0;
      box-sizing: border-box;
      color: #1C1A17;
    }
    .eyebrow {
      text-transform: uppercase;
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 1.1px;
      color: #726C61;
    }
    .title { font-size: 30px; font-weight: 700; margin: 2px 0 18px; letter-spacing: -0.3px; }
    .card {
      background: #FFFFFF;
      border-radius: 24px;
      padding: 16px;
      box-shadow: 0 10px 18px rgba(0,0,0,0.06);
      margin-bottom: 14px;
    }
    .totals-row { display: flex; align-items: center; gap: 18px; }
    .totals-col { flex: 1; display: flex; flex-direction: column; gap: 3px; }
    .totals-col .val { font-family: ui-serif, Georgia, serif; font-size: 22px; }
    .divider { width: 1px; height: 40px; background: #E8E4DC; }
    .chart-head { display: flex; align-items: baseline; justify-content: space-between; margin-bottom: 14px; }
    .chart-total { font-family: ui-serif, Georgia, serif; font-size: 17px; color: #1C1A17; }
    .chart-svg { display: block; width: 100%; }
    .axis-labels { display: flex; justify-content: space-between; margin-top: 6px; }
    .axis-labels span { font-size: 11px; color: #8C867C; }
    .today-tag {
      position: relative;
    }
    .callout {
      position: absolute;
      right: 0; top: -34px;
      background: #1C1A17;
      color: #F2EFE9;
      font-size: 11px;
      font-weight: 600;
      padding: 4px 8px;
      border-radius: 8px;
      white-space: nowrap;
    }
  </style>
</helmet>
